name: k-voyager
services:
  voyager:
    image: caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    container_name: k-voyager-web
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The upstream binary carries this file capability; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
      - /config:rw,noexec,nosuid,size=4m,uid=1000,gid=1000
      - /data:rw,noexec,nosuid,size=4m,uid=1000,gid=1000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../:/srv:ro
    ports:
      - '127.0.0.1:8787:8080'
    networks:
      web:
        aliases: [k-voyager-web]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/release.json']
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
networks:
  web:
    external: true
    name: kidsquest_web
